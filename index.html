<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>A.O.F. Tactical Agent Device</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000000;
      color: #ff6600; 
      font-family: 'Roboto Mono', monospace;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      font-weight: 700;
      letter-spacing: 5px;
      color: #ff6600;
      text-shadow: 0 0 8px rgba(255, 102, 0, 0.6);
      margin-bottom: 5px;
    }

    .map-container {
      position: relative;
      width: 1455px; 
      height: 725px;  
      margin: 20px auto 10px auto;
      border: 3px solid #ff6600; 
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.15);
      background-color: #050505;
    }

    .map-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.7; 
    }

    .map-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .sector {
      fill: rgba(255, 102, 0, 0.01); 
      stroke: rgba(255, 102, 0, 0.25); 
      stroke-width: 0.02; 
      cursor: pointer;
      transition: fill 0.1s ease, stroke 0.1s ease;
    }

    .sector:hover {
      fill: rgba(255, 102, 0, 0.25) !important; 
      stroke: #ff9900;
      stroke-width: 0.05;
    }

    /* Статусы секторов */
    .sector.level-safe { fill: rgba(0, 255, 106, 0.251); stroke: rgba(0, 255, 0, 0.3); }
    .sector.level-lowdanger { fill: rgba(119, 255, 0, 0.233); stroke: rgba(153, 255, 0, 0.4); }
    .sector.level-minordanger { fill: rgba(234, 255, 46, 0.325); stroke: rgba(242, 255, 0, 0.4); }
    .sector.level-moderatedanger { fill: rgba(255, 128, 0, 0.307); stroke: rgba(255, 165, 0, 0.4); }
    .sector.level-highdanger { fill: rgba(255, 0, 0, 0.3); stroke: rgba(255, 0, 0, 0.5); }
    .sector.level-unknown { fill: rgba(42, 41, 41, 0.18); stroke: rgba(35, 35, 35, 0.5); }
    .sector.level-event { fill: rgba(0, 115, 255, 0.18); stroke: rgba(0, 140, 255, 0.5); }

    .bottom-interface {
      width: 1455px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hazard-line {
      width: 100%;
      height: 12px;
      background: repeating-linear-gradient(45deg, #ff6600, #ff6600 10px, #000000 10px, #000000 20px);
      border: 1px solid #ff6600;
    }

    .footer-content {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
    }

    .global-news {
      font-size: 14px;
      color: #ff6600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-left: 3px solid #ff6600;
      padding-left: 15px;
      margin-top: 5px;
      max-width: 1000px;
    }

    .global-news span { color: #ffffff; }

    .logo-container img {
      width: 120px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 5px rgba(255, 102, 0, 0.5));
    }

    /* Окно информации */
    .info-popup {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #0c0c0c; 
      color: #ffffff;
      padding: 30px;
      border: 2px solid #ff6600; 
      box-shadow: 0 0 40px rgba(255, 102, 0, 0.3);
      z-index: 1000;
      width: 420px;
      box-sizing: border-box;
    }

    .info-popup h3 {
      margin-top: 0;
      font-size: 24px;
      color: #ff6600; 
      border-bottom: 2px solid #ff6600;
      padding-bottom: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .info-popup p {
      font-size: 14px;
      line-height: 1.6;
      color: #cccccc;
      margin: 15px 0;
    }

    .info-popup img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      margin-top: 10px;
      border: 1px solid #ff6600;
    }

    .close-btn {
      margin-top: 20px;
      background: #000000;
      color: #ff6600;
      border: 1px solid #ff6600;
      padding: 12px;
      cursor: pointer;
      width: 100%;
      font-family: 'Roboto Mono', monospace;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .close-btn:hover {
      background: #ff6600;
      color: #000000;
      text-shadow: -2px 0 #00ffff, 2px 0 #ff00ff;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999;
    }
  </style>
</head>

    <img id="popup-img" src="" alt="Observation footage">
    <button class="close-btn" id="close-popup">CONFIRM AND CLOSE</button>
  </div>

  <script>
    const popup = document.getElementById('popup');
    const overlay = document.getElementById('overlay');
    const popupTitle = document.getElementById('popup-title');
    const popupText = document.getElementById('popup-text');
    const popupImg = document.getElementById('popup-img');
    const closeBtn = document.getElementById('close-popup');

    document.querySelectorAll('.sector').forEach(sector => {
      sector.addEventListener('click', () => {
        const sName = sector.getAttribute('data-name') || "unknown sector";
        const sInfo = sector.getAttribute('data-info') || "The info may be censored or deleted";
        const sImg = sector.getAttribute('data-img') || "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_9eQWgPYch5uvv8G1uWSrUG58zNmRRpRmvxf6kGDklg&s=10";
        
        popupTitle.textContent = sName;
        popupText.textContent = sInfo;
        popupImg.src = sImg;
        
        popup.style.display = 'block';
        overlay.style.display = 'block';
      });
    });

    function closePopup() {
      popup.style.display = 'none';
      overlay.style.display = 'none';
    }

    closeBtn.addEventListener('click', closePopup);
    overlay.addEventListener('click', closePopup);
  </script>
